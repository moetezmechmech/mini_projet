services:
  eurekaserver:
    build: ./eurekaserver
    container_name: eurekaserver
    ports:
      - "18761:8761"
    healthcheck:
      test: "curl --fail --silent localhost:8761/actuator/health | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mysqldb:
    image: mysql
    container_name: mysqldb
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  configserver:
    build: ./configserver
    container_name: configserver
    ports:
      - "19999:9999"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_CLOUD_CONFIG_SERVER_MONITOR_GITHUB_WEBHOOKSECRET: ${GITHUB_WEBHOOK_SECRET:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:9999/actuator/health | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  cours-ms:
    build: ./cours_microservice
    container_name: cours-ms
    ports:
      - "8082:8080"
    environment:
      SERVER_PORT: 8080
      DISCOVERY_SERVICE_URL: http://eurekaserver:8761/eureka
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka
      CONFIG_SERVICE_URL: http://configserver:9999
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/test
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_RABBITMQ_HOST: rabbitmq
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      mysqldb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  formateur-ms:
    build: ./formateur
    container_name: formateur-ms
    ports:
      - "18081:8081"
    environment:
      DISCOVERY_SERVICE_URL: http://eurekaserver:8761/eureka
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka
      CONFIG_SERVICE_URL: http://configserver:9999
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      cours-ms:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gatewayserver:
    build: ./gatewayserver
    container_name: gatewayserver
    ports:
      - "8888:8888"
    environment:
      DISCOVERY_SERVICE_URL: http://eurekaserver:8761/eureka
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      eurekaserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
